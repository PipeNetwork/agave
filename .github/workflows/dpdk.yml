name: DPDK

on:
  push:
    branches:
      - master
      - v[0-9]+.[0-9]+
    paths:
      - "dpdk/**"
      - "core/**"
      - "streamer/**"
      - "turbine/**"
      - "validator/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/dpdk.yml"
      - "docs/src/validator/dpdk.md"
  pull_request:
    branches:
      - master
      - v[0-9]+.[0-9]+
    paths:
      - "dpdk/**"
      - "core/**"
      - "streamer/**"
      - "turbine/**"
      - "validator/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/dpdk.yml"
      - "docs/src/validator/dpdk.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: cargo check (dpdk)
    timeout-minutes: 45
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install DPDK (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dpdk \
            dpdk-dev \
            libdpdk-dev \
            pkg-config

      - name: Setup Rust
        shell: bash
        run: |
          source ci/rust-version.sh stable
          rustup default "$rust_stable"

      - name: Build validator with DPDK enabled
        run: |
          cargo check -p agave-validator --features dpdk

      - name: Run validator CLI tests (dpdk)
        run: |
          cargo test -p agave-validator --features dpdk --test cli

      - name: Run agave-dpdk unit tests
        run: |
          cargo test -p agave-dpdk --features dpdk
